[project]
name = "universal-jev"
version = "0.1.0"
description = "A transparent, model-agnostic decision inference layer for LLMs."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[project.optional-dependencies]
local = [
  "torch",
  "transformers",
  "accelerate",
]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_jev"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
